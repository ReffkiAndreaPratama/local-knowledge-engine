[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-knowledge-engine"
version = "0.1.0"
description = "Privacy-first local document search engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Local Knowledge Engine Contributors"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.17",

    # Document parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",

    # Search and embeddings (sentence-transformers is the optional `semantic` extra)
    "numpy>=1.26.0",

    # Utilities
    "httpx>=0.27.2",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.2.1",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/I/W catch real mistakes and import hygiene. Line length is enforced by the
# formatter in editors, not in CI, so E501 is not selected.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
